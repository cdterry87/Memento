# Weekly dependency updates (spec section 8.8). Minor and patch releases are
# grouped into one pull request per ecosystem, so CI checks them together.
version: 2
updates:
    - package-ecosystem: composer
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          composer-minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      groups:
          npm-minor-and-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
